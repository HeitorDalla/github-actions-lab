name: 04 - Using Actions

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Java
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

#      - name: List files
#        run: ls -l

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          cache: 'maven'

      - name: Checkout version java
        run: java --version

      - name: Install Dependencies
        run: mvn -B package

      - name: Checkout installed dependencies (/target)
        run: ls -l