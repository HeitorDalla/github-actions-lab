name: 04 - Using Actions

on:
#  push:
#    branches:
#      - main

  workflow_dispatch:

jobs:
  build:
    name: Build Java
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
          cache: 'maven'

      - name: Checkout version java
        run: java -version

      - name: Install Dependencies
        run: mvn -B package

      - name: Checkout installed dependencies (/target)
        if: always()
        run: |
          if [ $? -eq 0 ]; then
            echo "Build OK"
          else
            echo "Build com erro"
            exit 1
          fi

      - name: Run Unit Tests
        run: mvn clean test