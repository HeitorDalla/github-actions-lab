name: 6 - Contexts

on:
  #  push:
  #    branches:
  #      - main

  workflow_dispatch:
    inputs:
      debug:
        description: Debug
        default: false
        type: boolean

run-name: 6 - Contexts | DEBUG - ${{ inputs.debug }}

env:
  MY_WORKFLOW_VAR: "workflow"
  MY_OVERWRITTEN_VAR: "workflow"

jobs:
  echo-data:
    name: Job para executar contextos
    runs-on: ubuntu-latest

    env:
      MY_JOB_VAR: "job"
      MY_OVERWRITTEN_VAR: "job"

    #    steps:
    #        - name: Display Information using environment variables
    #          run: |
    #            echo "Event name: $GITHUB_EVENT_NAME"
    #            echo "Ref: $GITHUB_REF"
    #            echo "SHA: $GITHUB_SHA"
    #            echo "Actor: $GITHUB_ACTOR"
    #            echo "Workflow: $GITHUB_WORKFLOW"
    #            echo "Run ID: $GITHUB_RUN_ID"
    #            echo "Run Number: $GITHUB_RUN_NUMBER"

    steps:
      - name: Display Information using contexts
        run: |
          echo "Event name: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"
          echo "SHA: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"
          echo "Workflow: ${{ github.workflow }}"
          echo "Run ID: ${{ github.run_id }}"
          echo "Run Number: ${{ github.run_number }}"

      - name: Retrieve Variable
        run: |
          echo "Variavel do repositorio: ${{ vars.MY_VAR }}"

      - name: Print Env Variables
        env:
          MY_OVERWRITTEN_VAR: "step"

        run: |
          echo "Workflow env: ${{ env.MY_WORKFLOW_VAR }}"
          echo "Overwritten env: ${{ env.MY_OVERWRITTEN_VAR }}"

      - name: Print Env Variables 2
        run: |
          echo "Workflow env: ${{ env.MY_WORKFLOW_VAR }}"
          echo "Overwritten env: ${{ env.MY_OVERWRITTEN_VAR }}"
