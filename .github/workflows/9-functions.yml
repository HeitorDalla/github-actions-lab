name: 9 - Using Functions

run-name: 9 - Using Functions | DEBUG - ${{ inputs.debug && 'ON' || 'OFF' }}

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      debug:
        description: Debug
        type: boolean
        default: false

jobs:
  echo1:
    runs-on: ubuntu-latest

    steps:
      - name: Failing step
        run: exit 1

      - name: I will be skipped
        if: ${{ success() }}
        run: echo "I will print if previous steps succeed."

      - name: I will execute
        if: ${{ failure() }}
        run: I will print if any previous step fails.

      - name: I will execute
        if: ${{ !cancelled() }}
        run: echo "I will always print, except when the workflow is cancelled."

      - name: I will execute when cancelled
        if: ${{ cancelled() }}
        run: echo "I will print if previous steps cancelled."